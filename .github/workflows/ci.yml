name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cybersecurity_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov flake8 black mypy
    
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Check code formatting with black
      run: |
        black --check .
    
    - name: Type check with mypy
      run: |
        mypy agents/ infrastructure/ --ignore-missing-imports
    
    - name: Test with pytest
      env:
        POSTGRES_DB: cybersecurity_test
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
      run: |
        pytest tests/ -v --cov=agents --cov=infrastructure --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build MCP Server Docker image
      run: |
        cd infrastructure/mcp-server
        docker build -t cybersecurity-mcp-server:latest .
    
    - name: Test Docker containers
      run: |
        docker-compose -f infrastructure/docker-compose.yml config

  security-scan:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  deploy:
    needs: [test, docker-build, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Add your deployment commands here
        # Example: kubectl apply -f k8s/staging/

    - name: Run integration tests
      run: |
        echo "Running integration tests..."
        # Add integration test commands here

    - name: Deploy to production
      if: success()
      run: |
        echo "Deploying to production environment..."
        # Add your production deployment commands here
        # Example: kubectl apply -f k8s/production/

  # ---------------------------------------------------------------------------
  # Claude CI Failure Analysis
  # Runs ONLY when the test matrix fails on a pull request.
  # Claude reads the changed files, identifies the likely root cause, and posts
  # a diagnostic comment so developers don't have to decode raw CI logs.
  # ---------------------------------------------------------------------------
  claude-ci-analysis:
    needs: test
    runs-on: ubuntu-latest
    if: failure() && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: anthropics/claude-code-action@v1
      with:
        anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
        github_token: ${{ secrets.GITHUB_TOKEN }}
        use_sticky_comment: "true"
        prompt: |
          The CI test job just failed on this pull request for a Python PKI
          AI agent framework. The failing pipeline runs:
            1. flake8 linting (syntax errors, undefined names)
            2. black formatting check
            3. mypy type checking on agents/ and infrastructure/
            4. pytest tests/ with a PostgreSQL service

          Steps:
          1. Run `git diff origin/${{ github.base_ref }}...HEAD --name-only` to list the
             changed files in this PR.
          2. Read the most recently changed Python files in agents/ and infrastructure/.
          3. Read tests/test_mcp_integration.py to understand what is being tested.
          4. Identify the most likely cause of the failure (lint error, type error,
             import error, test assertion, missing dependency, etc.).
          5. Post a short, structured comment with:
             - **Root cause** (one sentence)
             - **Affected file(s) and line(s)**
             - **Suggested fix** (show the corrected code snippet if straightforward)

          Keep the comment under 400 words. Do not paste raw test output.
          Focus entirely on actionable guidance for the developer.
